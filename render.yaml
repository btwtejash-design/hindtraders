services:
  # Single Unified Web Service (FastAPI Backend + React Frontend bundled)
  - type: web
    name: hindtraders-app
    env: python
    region: singapore
    plan: free
    buildCommand: npm --prefix "doc generation/client" install --include=optional && npm --prefix "doc generation/client" run build && pip install -r "doc generation/server/requirements.txt"
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.18.0
